<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>xyhspace · 小小星球</title>
  <meta name="description" content="一个小女孩在属于她的星球上奔跑。白天有太阳和风，夜晚月亮升起，房子的窗会亮起来。">
  <meta name="theme-color" id="theme-color" content="#cfeade">
  <meta property="og:title" content="xyhspace · 小小星球">
  <meta property="og:description" content="一个小女孩在属于她的星球上奔跑。点一下太阳，夜色就会降临。">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <h1 class="sr-only">xyhspace · 小小星球</h1>

  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- 小女孩：矮胖火柴人，身体前倾 -->
  <div id="girl-layer" aria-hidden="true">
    <svg id="girl-svg" viewBox="0 0 200 360" xmlns="http://www.w3.org/2000/svg">
      <!-- 远侧腿 -->
      <g transform="translate(102,212)">
        <g id="g-leg-far">
          <path class="g-stick" d="M0,0 L0,56" stroke-width="18"/>
          <g id="g-shin-far" transform="rotate(18 0 56)">
            <path class="g-stick" d="M0,56 L0,126" stroke-width="18"/>
          </g>
        </g>
      </g>

      <!-- 远侧手臂 -->
      <g transform="translate(114,150)">
        <g id="g-arm-far">
          <path class="g-stick" d="M0,0 L0,38" stroke-width="16"/>
          <g id="g-fore-far" transform="rotate(40 0 38)">
            <path class="g-stick" d="M0,38 L0,74" stroke-width="16"/>
          </g>
        </g>
      </g>

      <!-- 身体：从髋到肩向前倾 -->
      <path class="g-stick" d="M106,212 L119,144" stroke-width="24"/>
      <circle class="g-stick-fill" cx="122" cy="100" r="42"/>

      <!-- 近侧腿 -->
      <g transform="translate(108,212)">
        <g id="g-leg-near">
          <path class="g-stick" d="M0,0 L0,56" stroke-width="18"/>
          <g id="g-shin-near" transform="rotate(-10 0 56)">
            <path class="g-stick" d="M0,56 L0,126" stroke-width="18"/>
          </g>
        </g>
      </g>

      <!-- 近侧手臂 -->
      <g transform="translate(118,150)">
        <g id="g-arm-near">
          <path class="g-stick" d="M0,0 L0,38" stroke-width="16"/>
          <g id="g-fore-near" transform="rotate(-40 0 38)">
            <path class="g-stick" d="M0,38 L0,74" stroke-width="16"/>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <!-- 真正可点击 / 可聚焦的按钮，覆盖在画布里的太阳上 -->
  <button class="sun-toggle" type="button" aria-label="切换白天与夜晚" title="切换白天与夜晚"></button>

  <p class="sr-only" role="status" aria-live="polite" id="status"></p>

  <p class="credit">Produced by <b>Xrime</b></p>

  <noscript>
    <p class="noscript">这颗小星球需要开启 JavaScript 才能转动起来。</p>
  </noscript>

  <script src="assets/main.js" defer></script>
</body>
</html>
